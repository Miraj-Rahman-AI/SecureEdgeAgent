[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secureedgeagent"
version = "1.0.0"
description = "Security- and trust-aware adaptive edge-cloud orchestration for autonomous AI agents in 6G networks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "" }
]
dependencies = [
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6"
]

[project.scripts]
secureedgeagent-generate = "scripts.generate_workload:main"
secureedgeagent-run = "scripts.run_experiment:main"

[tool.setuptools.packages.find]
include = ["secureedgeagent*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
