name: SecureEdgeAgent CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Generate workload
        run: |
          python -m scripts.generate_workload \
            --output-dir data/generated \
            --seed 42

      - name: Run minimal evaluation
        run: |
          python -m scripts.run_experiment \
            --workload data/generated/evaluation.jsonl \
            --runs 1 \
            --strategies full-secureedgeagent \
            --output results/generated/ci_results.csv
